[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baitcheck"
version = "1.0.0"
description = "Analyze .eml files for phishing indicators (SPF/DKIM/DMARC, lookalike domains, deceptive links, risky attachments, BEC) and extract defanged IOCs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
  "Topic :: Communications :: Email",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "bandit>=1.7"]

[project.scripts]
baitcheck = "baitcheck.cli:main"

[tool.setuptools]
packages = ["baitcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
